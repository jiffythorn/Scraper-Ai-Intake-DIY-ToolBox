# Mr T's DIY Lead Scraper — configuration
# Copy this file to config.yml and edit. Format is simple "key: value" lines.
#   cp config.example.yml config.yml

# --- WHERE & WHAT ---------------------------------------------------------
# Town or area to search (be specific: "Asheville, NC", "Llanelli, Wales")
town: Asheville, NC

# What to look for. Built-in choices:
#   restaurant, cafe, bakery, barber, hairdresser, dentist, vet, gym,
#   auto_repair, plumber, electrician, builder, roofer, landscaper,
#   lawyer, real_estate
category: roofer

# Search radius in meters (2000 = tight town center, 10000 = whole county)
radius_meters: 10000

# Custom OSM tag override (uncomment to bypass 'category'):
# osm_tag: shop=bicycle

# --- WEBSITE EMAIL CRAWLING ------------------------------------------------
# Visit each lead's published website to find a publicly listed email.
# Polite by design: robots.txt respected, 1 request/second, few pages.
crawl_website_emails: true
max_pages_per_site: 5

# --- OUTPUT -----------------------------------------------------------------
# Maximum number of leads to keep (empty = keep everything)
# limit: 50

# --- POLITE IDENTIFICATION --------------------------------------------------
# Free services (OpenStreetMap) ask that a contact be identifiable.
# Put a real email here so admins can reach you instead of blocking you.
contact: you@yourdomain.com
